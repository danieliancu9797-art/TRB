<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMR — Tariblanca Fruit</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
:root{--teal:#159a9c;--dark:#0d6d76;--ink:#1b2a33;--muted:#5b6b74;--line:#b8d8d8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f8f8;font-size:13px;line-height:1.4}
.page{max-width:1000px;margin:0 auto;background:#fff;min-height:100vh}
.head{background:linear-gradient(110deg,var(--dark),var(--teal));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.head h1{font-size:20px}.badge{background:#fff;color:var(--dark);border-radius:20px;padding:1px 10px;font-weight:900;font-size:15px;margin-right:8px}
.head p{font-size:11px;opacity:.9;margin-top:6px}.code{text-align:right;font-family:monospace;font-size:16px;font-weight:800;word-break:break-all}
.code small{display:block;font-family:Arial;font-size:10px;opacity:.85;font-weight:400;margin-bottom:2px}
.wrap{padding:18px 22px}
fieldset{border:1.5px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
legend{background:var(--teal);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:6px 6px 0 0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.kv>div{min-width:0}.lbl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dark);font-weight:700}
.val{font-weight:700;font-size:13px;word-break:break-word}.sub{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11.5px}th,td{border:1px solid #cfe3e3;padding:5px 7px;text-align:left;vertical-align:top}
th{background:#eaf6f6;color:var(--dark);font-size:9.5px;text-transform:uppercase}.tot{font-weight:800;color:var(--dark)}
.legal{font-size:11px;color:#444;padding:12px;background:#f7fbfb}
.foot{border-top:1px solid var(--line);margin-top:8px;padding:12px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.hash{font-family:monospace;word-break:break-all}
.actions{padding:16px 22px;text-align:center}
.actions button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:14px;margin:4px}
.actions button.sec{background:#0d6d76}
.error{padding:50px;text-align:center;color:#a33;font-size:16px}
@media(max-width:600px){.kv{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}}
@media print{body{background:#fff}.actions{display:none}.page{max-width:none}fieldset{break-inside:avoid}}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
(function(){
  var page=document.getElementById('page');
  function decode(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';return JSON.parse(decodeURIComponent(escape(atob(b64))));}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  var raw=location.hash.replace(/^#/,'');
  if(!raw){page.innerHTML='<div class="error">Sin datos de CMR en la dirección.</div>';return;}
  var d;
  try{d=decode(raw);}catch(e){page.innerHTML='<div class="error">No se pudo leer el documento: '+esc(e.message)+'</div>';return;}
  var lineas=d.lineas||[];
  var totB=lineas.reduce(function(a,l){return a+(parseFloat(l.bultos)||0)},0);
  var totKg=lineas.reduce(function(a,l){return a+(parseFloat(l.peso)||0)},0);
  var h='';
  h+='<div class="head"><div><h1><span class="badge">TRB</span>C.M.R · Carta de porte internacional</h1><p>'+esc(d.empresa||'TARIBLANCA FRUIT')+' — '+esc(d.tipo||'Salida')+' — Documento generado electrónicamente</p></div><div class="code"><small>DOCUMENTO Nº</small>'+esc(d.num||'—')+'<small>FECHA '+esc(d.fecha||'—')+'</small></div></div>';
  h+='<div class="wrap">';
  h+='<fieldset><legend>1 · Remitente y destinatario</legend><div class="kv">';
  h+='<div><div class="lbl">1 · Remitente</div><div class="val">'+esc(d.empresa||'—')+'</div><div class="sub">'+esc(d.empCif||'')+'</div></div>';
  h+='<div><div class="lbl">2 · Destinatario</div><div class="val">'+esc(d.cliente||'—')+'</div><div class="sub">'+esc(d.cliCif||'')+'</div></div>';
  h+='<div><div class="lbl">16 · Porteador</div><div class="val">'+esc(d.transporte||'—')+'</div></div>';
  h+='<div><div class="lbl">3 · Lugar de entrega</div><div class="val">'+esc(d.lugarentrega||'—')+'</div></div>';
  h+='<div><div class="lbl">4 · Lugar y fecha de carga</div><div class="val">'+esc(d.lugarcarga||'—')+'</div><div class="sub">'+esc(d.fecha||'')+'</div></div>';
  h+='<div><div class="lbl">Registrado por</div><div class="val">'+esc(d.usuario||'—')+'</div></div>';
  h+='</div></fieldset>';
  h+='<fieldset><legend>2 · Transporte y matrículas</legend><div class="kv">';
  h+='<div><div class="lbl">17 · Matrícula vehículo</div><div class="val">'+esc(d.matricula||'—')+'</div></div>';
  h+='<div><div class="lbl">17 Bis · Remolque</div><div class="val">'+esc(d.matriculaRemolque||'—')+'</div></div>';
  h+='<div><div class="lbl">Distancia / Km</div><div class="val">'+esc(d.distancia||'—')+'</div></div>';
  h+='</div></fieldset>';
  h+='<fieldset><legend>3 · Mercancía (casillas 6-12)</legend><table><thead><tr><th>6 · Marcas</th><th>7 · Bultos</th><th>8 · Embalaje</th><th>9 · Naturaleza</th><th>10 · Código</th><th>11 · Peso bruto</th><th>12 · Volumen</th></tr></thead><tbody>';
  lineas.forEach(function(l){
    h+='<tr><td>'+esc(l.marcas||'—')+'</td><td style="text-align:center">'+esc(l.bultos||0)+'</td><td>'+esc(l.embalaje||'—')+'</td><td><b>'+esc(l.producto||'—')+'</b>'+(l.traz?'<br><span style="color:#555;font-size:9px">'+esc(l.traz)+'</span>':'')+'</td><td>'+esc(l.codigo||'—')+'</td><td style="text-align:right"><b>'+esc(l.peso||'0')+'</b></td><td>'+esc(l.volumen||'—')+'</td></tr>';
  });
  h+='<tr><th colspan="1">TOTALES</th><th style="text-align:center">'+totB+'</th><th colspan="3"></th><th class="tot" style="text-align:right">'+totKg.toFixed(2)+' kg</th><th></th></tr>';
  h+='</tbody></table></fieldset>';
  h+='<fieldset><legend>4 · Instrucciones, pago y observaciones</legend><div class="kv">';
  h+='<div style="grid-column:span 2"><div class="lbl">13 · Instrucciones del remitente</div><div class="val">'+esc(d.instrucciones||'—')+'</div></div>';
  h+='<div><div class="lbl">14 · Forma de pago</div><div class="val">'+esc(d.pago||'—')+'</div></div>';
  h+='<div style="grid-column:span 2"><div class="lbl">18 · Reservas y observaciones</div><div class="val">'+esc(d.observaciones||'—')+'</div></div>';
  h+='<div><div class="lbl">5 · Documentos anexos</div><div class="val">'+esc(d.documentos||'—')+'</div></div>';
  h+='</div></fieldset>';
  h+='<fieldset><legend>5 · Estipulaciones y firma</legend><div class="legal">La duración de este transporte estará sujeta a las normas establecidas en cada país en el acuerdo europeo sobre las condiciones de trabajo (Acuerdo A.E.T.R.).<br>La mercancía se entrega conforme en cantidad y calidad salvo reclamación en las 24 horas siguientes a la recepción.</div><div class="kv"><div style="grid-column:span 1"><div class="lbl">21 · Lugar y fecha de emisión</div><div class="val">'+esc(d.lugarEmision||d.empresa||'')+'</div></div><div style="grid-column:span 2"><div class="lbl">Firmas (casillas 22, 23, 24)</div><div class="val">_________________________ &nbsp; _________________________ &nbsp; _________________________</div></div></div></fieldset>';
  h+='</div>';
  h+='<div class="foot"><span>TRB · Tariblanca Fruit — Carta de porte internacional (CMR)</span><span>HASH '+esc(d.hash||'')+'</span></div>';
  h+='<div class="actions"><button onclick="window.print()">🖨 Imprimir</button><button class="sec" id="btn-descargar">⬇ Descargar PDF</button></div>';
  page.innerHTML=h;

  document.getElementById('btn-descargar').onclick=function(){
    try{
      if(typeof jspdf==='undefined'){alert('No se pudo cargar la librería PDF. Usa el botón Imprimir y elige "Guardar como PDF".');return;}
      var pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      var W=210,M=12,CW=W-M*2;
      function seccion(num,titulo,yy){pdf.setFillColor(21,154,156);pdf.rect(M,yy,CW,8,'F');pdf.setTextColor(255,255,255);pdf.setFont(undefined,'bold');pdf.setFontSize(11);pdf.text(num+' · '+titulo,M+3,yy+5.5);return yy+12;}
      function campo(lbl,val,yy,xx){pdf.setFont(undefined,'normal');pdf.setFontSize(8);pdf.setTextColor(110,120,125);pdf.text(lbl,xx,yy);pdf.setFont(undefined,'bold');pdf.setFontSize(11);pdf.setTextColor(20,35,42);pdf.text(String(val||'—').substring(0,40),xx,yy+5);}
      pdf.setFillColor(13,109,118);pdf.rect(0,0,W,34,'F');
      pdf.setTextColor(255,255,255);pdf.setFont(undefined,'bold');pdf.setFontSize(20);pdf.text('C.M.R',M,15);
      pdf.setFontSize(11);pdf.text('TRB',M+30,15);
      pdf.setFont(undefined,'normal');pdf.setFontSize(9);pdf.text('Carta de porte internacional · Tariblanca Fruit',M,22);
      pdf.text(esc(d.tipo||'Salida'),M,28);
      pdf.setFont(undefined,'bold');pdf.setFontSize(12);pdf.text(d.num||'—',W-M,14,{align:'right'});
      pdf.setFont(undefined,'normal');pdf.setFontSize(9);pdf.text(d.fecha||'',W-M,21,{align:'right'});
      var y=42;
      y=seccion('1','Remitente y destinatario',y);
      pdf.setDrawColor(200,220,220);pdf.rect(M,y-4,CW,22);
      campo('1 · REMITENTE',d.empresa||'',y+3,M+3);
      campo('CIF',d.empCif||'',y+13,M+3);
      pdf.line(M+95,y-4,M+95,y+18);
      campo('2 · DESTINATARIO',d.cliente||'',y+3,M+98);
      campo('CIF',d.cliCif||'',y+13,M+98);
      y+=24;
      y=seccion('2','Transporte y lugares',y);
      pdf.setDrawColor(200,220,220);pdf.rect(M,y-4,CW,22);
      campo('16 · PORTEADOR',d.transporte||'',y+3,M+3);
      campo('3 · LUGAR ENTREGA',d.lugarentrega||'',y+3,M+105);
      campo('4 · LUGAR CARGA',d.lugarcarga||'',y+13,M+3);
      campo('17 · MATRICULA',d.matricula||'',y+13,M+105);
      y+=24;
      y=seccion('3','Mercancia (casillas 6-12)',y);
      var colX=[M+3,M+32,M+72,M+110,M+150,M+178];
      pdf.setFillColor(234,246,246);pdf.setDrawColor(184,216,216);pdf.rect(M,y-4,CW,8,'FD');
      pdf.setFont(undefined,'bold');pdf.setFontSize(8);pdf.setTextColor(13,109,118);
      pdf.text('BULTOS',colX[0],y+1.5);pdf.text('EMBALAJE',colX[1],y+1.5);pdf.text('NATURALEZA',colX[2],y+1.5);pdf.text('CODIGO',colX[3],y+1.5);pdf.text('PESO KG',colX[4],y+1.5);
      y+=8;
      lineas.forEach(function(l){
        pdf.setDrawColor(220,235,235);pdf.line(M,y-2,M+CW,y-2);
        pdf.setFont(undefined,'normal');pdf.setFontSize(9);pdf.setTextColor(30,42,50);
        pdf.text(String(l.bultos||0),colX[0],y+2);
        pdf.text(String(l.embalaje||'—').substring(0,12),colX[1],y+2);
        pdf.text(String(l.producto||'—').substring(0,18),colX[2],y+2);
        pdf.text(String(l.codigo||'—').substring(0,10),colX[3],y+2);
        pdf.setFont(undefined,'bold');pdf.text(String(l.peso||'0'),colX[4],y+2);
        y+=7;
        if(y>235){pdf.addPage();y=16;}
      });
      pdf.setFillColor(234,246,246);pdf.rect(M,y-2,CW,8,'F');
      pdf.setFont(undefined,'bold');pdf.setFontSize(10);pdf.setTextColor(13,109,118);
      pdf.text('TOTALES ('+lineas.length+' lineas)',M+3,y+3.5);
      pdf.text(totB+' bultos',M+90,y+3.5);
      pdf.text(totKg.toFixed(2)+' kg',M+150,y+3.5);
      y+=12;
      y=seccion('4','Instrucciones y pago',y);
      pdf.setDrawColor(200,220,220);pdf.rect(M,y-4,CW,16);
      pdf.setFont(undefined,'normal');pdf.setFontSize(9);pdf.setTextColor(30,42,50);
      pdf.text('13 · Instrucciones: '+String(d.instrucciones||'—').substring(0,90),M+3,y+2);
      pdf.text('14 · Pago: '+String(d.pago||'—').substring(0,40)+'   18 · Obs: '+String(d.observaciones||'—').substring(0,45),M+3,y+8);
      y+=18;
      y=seccion('5','Condiciones y firma',y);
      pdf.setFont(undefined,'normal');pdf.setFontSize(8);pdf.setTextColor(80,90,95);
      pdf.text('La mercancia se entrega conforme en cantidad y calidad salvo reclamacion en las 24 horas.',M,y);
      pdf.text('El presente documento es un CMR segun el Convenio de Transporte Internacional de Mercancias.',M,y+4);
      y+=12;
      pdf.setDrawColor(120,130,135);
      pdf.line(M,y,M+58,y);pdf.line(M+76,y,M+134,y);pdf.line(M+152,y,M+CW,y);
      pdf.setFont(undefined,'normal');pdf.setFontSize(8);pdf.setTextColor(60,70,75);
      pdf.text('22 · Remitente',M,y+4);
      pdf.text('23 · Porteador',M+76,y+4);
      pdf.text('24 · Destinatario',M+152,y+4);
      pdf.setFont(undefined,'normal');pdf.setFontSize(7);pdf.setTextColor(150,160,165);
      pdf.text('TARIBLANCA FRUIT · TRB — HASH '+(d.hash||''),M,285);
      pdf.save('CMR-'+(d.num||'TRB')+'.pdf');
    }catch(e){alert('Error generando PDF: '+e.message);}
  };
})();
</script>
</body>
</html>
